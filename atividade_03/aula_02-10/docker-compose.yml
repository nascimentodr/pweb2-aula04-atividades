
services:
  frontend:
    build: ./frontend
    container_name: web2-todo-nest-frontend
    ports:
      - "5173:80"
    # Garante que host.docker.internal funcione também no Docker em Linux/WSL.
    # (No Docker Desktop do Windows/macOS já funciona por padrão.)
    extra_hosts:
      - "host.docker.internal:host-gateway"
  db:
    image: postgres:16-alpine
    container_name: web2-todo-db
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
      POSTGRES_DB: todo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: